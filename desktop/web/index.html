<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the player can reach under the iPad's rounded
         corners and home indicator rather than leaving black bars. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0b0f" />
    <!-- Added to the Home Screen, iOS uses this rather than a screenshot of
         the page, and opens it without any browser chrome. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Library" />
    <title>Library</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.jsx"></script>
  </body>
</html>
